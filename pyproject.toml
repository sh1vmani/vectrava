[project]
name = "vectrava"
version = "0.0.1"
description = "AI application security scanner. Denial-of-Wallet, indirect prompt injection, and RAG boundary probes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shivamani Vastrala", email = "shivamaniuni1@gmail.com" }]
keywords = ["security", "llm", "ai", "scanner", "prompt-injection", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "httpx>=0.27",
    "structlog>=24",
    "jsonschema>=4",
    "cryptography>=43",
    "tenacity>=8",
]

[project.urls]
Homepage = "https://github.com/sh1vmani/vectrava"
Repository = "https://github.com/sh1vmani/vectrava"
Issues = "https://github.com/sh1vmani/vectrava/issues"

[project.scripts]
vectrava = "vectrava.cli:app"
vtra = "vectrava.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectrava"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = ["COM812", "ISC001", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
