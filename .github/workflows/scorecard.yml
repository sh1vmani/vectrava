name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 8 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Publishing results and uploading SARIF to code scanning require GitHub
    # Advanced Security on private repositories, which this project does not
    # have. Gate on public visibility so the job skips cleanly while the repo is
    # private and activates when it flips public at the Week 12 launch. Remove
    # this gate at launch: scheduled events do not populate
    # github.event.repository, so leaving it would skip the weekly run.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
